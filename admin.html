<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Jaronhav TCG — Add a Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0E13;
    --surface:#151A22;
    --surface-raised:#1D232E;
    --line:#2A3140;
    --text:#EDEAE3;
    --muted:#8B92A0;
    --gold:#C9A24B;
    --gold-bright:#E6C673;
    --danger:#D96C5F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:600;
    color:var(--text);
  }
  .logo span{ color:var(--gold); }
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--muted);
    font-family:'Barlow Condensed', sans-serif; font-weight:600; letter-spacing:0.05em;
    text-transform:uppercase; font-size:0.8rem; padding:8px 14px; border-radius:4px; cursor:pointer;
    display:none;
  }
  #logoutBtn:hover{ color:var(--text); border-color:var(--gold); }

  main{ max-width:720px; margin:0 auto; padding:50px 24px 100px; }

  .eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
    font-size:0.78rem; font-weight:600; margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.9rem; margin-bottom:30px;
  }
  h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.3rem; margin:44px 0 18px;
  }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:28px; margin-bottom:24px;
  }

  label{
    display:block; font-family:'Barlow Condensed', sans-serif; font-size:0.8rem;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--muted);
    margin-bottom:6px; margin-top:16px;
  }
  label:first-child{ margin-top:0; }
  input[type="text"], input[type="password"], input[type="email"]{
    width:100%; background:var(--void); border:1px solid var(--line); color:var(--text);
    padding:11px 13px; border-radius:4px; font-family:'Inter', sans-serif; font-size:0.95rem;
  }
  input:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

  button{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; cursor:pointer; border-radius:4px; border:none;
  }
  .btn-primary{
    background:var(--gold); color:#1A1406; padding:12px 22px; font-size:0.9rem; margin-top:20px;
  }
  .btn-primary:hover{ background:var(--gold-bright); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-secondary{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    padding:11px 20px; font-size:0.9rem;
  }
  .btn-secondary:hover{ color:var(--text); border-color:var(--gold); }
  .btn-danger{
    background:transparent; color:var(--danger); border:1px solid rgba(217,108,95,0.4);
    padding:6px 12px; font-size:0.78rem;
  }
  .btn-danger:hover{ background:rgba(217,108,95,0.12); border-color:var(--danger); }
  .btn-small{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    padding:6px 12px; font-size:0.78rem;
  }
  .btn-small:hover{ color:var(--text); border-color:var(--gold); }

  .status{
    margin-top:14px; font-family:'Barlow Condensed', sans-serif; font-size:0.88rem;
    letter-spacing:0.02em; padding:10px 12px; border-radius:4px; display:none;
  }
  .status.show{ display:block; }
  .status.error{ background:rgba(217,108,95,0.12); color:var(--danger); }
  .status.success{ background:rgba(201,162,75,0.12); color:var(--gold-bright); }
  .status.info{ background:rgba(139,146,160,0.12); color:var(--muted); }

  /* ---------- Existing cards list ---------- */
  .card-row{
    display:flex; align-items:center; gap:14px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .card-row:last-child{ border-bottom:none; }
  .card-row .thumb{
    width:44px; height:55px; border-radius:4px; overflow:hidden; flex-shrink:0;
    background:linear-gradient(155deg, #232A36 0%, #171B22 55%, #10131A 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .card-row .thumb img{ width:100%; height:100%; object-fit:cover; }
  .card-row .thumb .mark{ font-family:'Fraunces', serif; font-size:1.1rem; color:rgba(237,234,227,0.2); }
  .card-row .row-info{ flex:1; min-width:0; }
  .card-row .row-title{ font-size:0.92rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-row .row-meta{
    font-family:'Barlow Condensed', sans-serif; font-size:0.78rem; color:var(--muted);
    letter-spacing:0.02em; margin-top:2px;
  }
  .card-row .row-actions{ display:flex; gap:8px; flex-shrink:0; }
  .empty-list{ color:var(--muted); font-size:0.9rem; padding:8px 0; }

  /* ---------- Tile preview (matches index.html exactly) ---------- */
  .preview-wrap{ display:none; }
  .preview-wrap.show{ display:block; }
  .preview-label{
    font-family:'Barlow Condensed', sans-serif; font-size:0.78rem; letter-spacing:0.15em;
    text-transform:uppercase; color:var(--muted); margin-bottom:14px;
  }
  .tile-preview{
    max-width:260px; background:var(--surface-raised); border:1px solid var(--line);
    border-radius:6px; overflow:hidden; margin-bottom:24px;
  }
  .art{
    aspect-ratio:4/5; position:relative;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, #232A36 0%, #171B22 55%, #10131A 100%);
    overflow:hidden;
  }
  .art .mark{
    font-family:'Fraunces', serif; font-size:2.6rem; color:rgba(237,234,227,0.14);
  }
  .art img{ width:100%; height:100%; object-fit:cover; }
  .tag{
    position:absolute; top:14px; right:-8px;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold));
    color:#1A1406; font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:1rem;
    padding:5px 16px 5px 14px; border-radius:3px 0 0 3px; box-shadow:0 6px 14px -4px rgba(0,0,0,0.5);
  }
  .was-tag{
    position:absolute; top:50px; right:14px;
    color:var(--muted);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:0.78rem;
    text-decoration:line-through;
    opacity:0.85;
  }
  .grade-chip{
    position:absolute; top:14px; left:14px; font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem; color:var(--void); background:var(--text); padding:3px 8px; border-radius:3px;
  }
  .tile-preview .info{ padding:16px; }
  .tile-preview h3{ font-family:'Fraunces', serif; font-weight:500; font-size:1.08rem; margin-bottom:6px; }
  .tile-preview .meta{
    font-family:'Barlow Condensed', sans-serif; font-size:0.85rem; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--muted);
  }
  .tile-preview .ebay-link{
    display:block;
    font-family:'Barlow Condensed', sans-serif; font-size:0.78rem;
    color:var(--muted); text-decoration:underline; margin-top:6px;
  }

  .image-picker{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .image-picker img{
    width:56px; height:56px; object-fit:cover; border-radius:4px; cursor:pointer;
    border:2px solid var(--line); opacity:0.6;
  }
  .image-picker img.selected{ border-color:var(--gold); opacity:1; }

  .aspects{
    margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
  }
  .aspects summary{
    font-family:'Barlow Condensed', sans-serif; font-size:0.8rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); cursor:pointer;
  }
  .aspects table{ width:100%; margin-top:10px; font-size:0.85rem; border-collapse:collapse; }
  .aspects td{ padding:4px 8px 4px 0; border-bottom:1px solid var(--line); color:var(--muted); }
  .aspects td:first-child{ color:var(--text); white-space:nowrap; }

  .actions{ display:flex; gap:12px; margin-top:24px; }
</style>
</head>
<body>

<header>
  <div class="logo">Jaronhav<span>TCG</span> <span style="color:var(--muted); font-size:0.9rem; font-weight:400;">— Add a Card</span></div>
  <button id="logoutBtn">Log out</button>
</header>

<main>

  <div class="panel" id="loginPanel">
    <div class="eyebrow">Admin</div>
    <h1 style="font-size:1.4rem; margin-bottom:20px;">Enter password</h1>
    <label for="passwordInput">Password</label>
    <input type="password" id="passwordInput" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Log in</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="toolWrap" style="display:none;">
    <div class="eyebrow">Not listed here?</div>
    <h1>Add a card to the request grid</h1>

    <div class="panel">
      <label for="lookupInput">eBay item ID or listing URL</label>
      <input type="text" id="lookupInput" placeholder="e.g. 276481039215 or https://www.ebay.com/itm/...">
      <button class="btn-primary" id="lookupBtn">Look Up</button>
      <div class="status" id="lookupStatus"></div>
    </div>

    <div class="preview-wrap" id="previewWrap">
      <div class="preview-label" id="previewLabel">Preview — edit anything before approving</div>

      <div class="tile-preview">
        <div class="art">
          <span class="grade-chip" id="previewGradeChip">—</span>
          <span class="tag" id="previewTag">—</span>
          <span class="was-tag" id="previewWasTag" style="display:none;"></span>
          <span class="mark" id="previewMark" style="display:none;">?</span>
          <img id="previewImg" style="display:none;">
        </div>
        <div class="info">
          <h3 id="previewTitle">—</h3>
          <div class="meta" id="previewMeta">—</div>
          <a class="ebay-link" id="previewEbayLink" href="#" target="_blank" rel="noopener">View on eBay ↗</a>
        </div>
      </div>

      <div class="panel">
        <label for="fieldTitle">Title</label>
        <input type="text" id="fieldTitle">

        <label for="fieldPrice">Your Price</label>
        <input type="text" id="fieldPrice" placeholder="$435">

        <label for="fieldEbayPrice">eBay Price (shown crossed out — leave blank to hide)</label>
        <input type="text" id="fieldEbayPrice" placeholder="$650">

        <label for="fieldGrade">Grade</label>
        <input type="text" id="fieldGrade" placeholder="PSA 10">

        <label for="fieldSet">Set</label>
        <input type="text" id="fieldSet" placeholder="Champion's Path">

        <label>Image</label>
        <div class="image-picker" id="imagePicker"></div>
        <input type="text" id="fieldImage" placeholder="Or paste an image URL directly" style="margin-top:8px;">

        <label for="fieldEbayId">eBay item ID</label>
        <input type="text" id="fieldEbayId" readonly style="opacity:0.6;">

        <details class="aspects" id="aspectsWrap">
          <summary>Raw item specifics from eBay (reference)</summary>
          <table id="aspectsTable"></table>
        </details>

        <div class="actions">
          <button class="btn-primary" id="approveBtn" style="margin-top:0;">Approve &amp; Add</button>
          <button class="btn-secondary" id="discardBtn">Discard</button>
        </div>
        <div class="status" id="approveStatus"></div>
      </div>
    </div>

    <h2>Your cards</h2>
    <div class="panel">
      <div id="cardList"><div class="empty-list">Loading…</div></div>
      <div class="status" id="listStatus"></div>
    </div>
  </div>

</main>

<script>
  const loginPanel = document.getElementById('loginPanel');
  const toolWrap = document.getElementById('toolWrap');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginStatus = document.getElementById('loginStatus');

  function showStatus(el, message, type){
    el.textContent = message;
    el.className = `status show ${type}`;
  }
  function hideStatus(el){
    el.className = 'status';
  }

  function showTool(){
    loginPanel.style.display = 'none';
    toolWrap.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    loadCardList();
  }
  function showLogin(){
    loginPanel.style.display = 'block';
    toolWrap.style.display = 'none';
    logoutBtn.style.display = 'none';
  }

  // ---- Session check on load ----
  fetch('/api/admin-login')
    .then((res) => { if (res.ok) showTool(); else showLogin(); })
    .catch(() => showLogin());

  // ---- Login ----
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const password = document.getElementById('passwordInput').value;
    hideStatus(loginStatus);
    try {
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        showTool();
      } else {
        showStatus(loginStatus, 'Wrong password.', 'error');
      }
    } catch (err) {
      showStatus(loginStatus, 'Something went wrong.', 'error');
    }
  });
  document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  // ---- Logout ----
  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/admin-login', { method: 'DELETE' });
    showLogin();
  });

  // ---- Lookup (add mode) ----
  const lookupBtn = document.getElementById('lookupBtn');
  const lookupStatus = document.getElementById('lookupStatus');
  const previewWrap = document.getElementById('previewWrap');
  const previewLabel = document.getElementById('previewLabel');
  const approveBtn = document.getElementById('approveBtn');
  const discardBtn = document.getElementById('discardBtn');
  const approveStatus = document.getElementById('approveStatus');
  let currentImages = [];
  let selectedImage = '';
  let mode = 'add'; // 'add' | 'edit'

  lookupBtn.addEventListener('click', async () => {
    const input = document.getElementById('lookupInput').value.trim();
    if (!input) return;
    hideStatus(lookupStatus);
    lookupBtn.disabled = true;
    lookupBtn.textContent = 'Looking up…';

    try {
      const res = await fetch('/api/ebay-lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input }),
      });
      const data = await res.json();

      if (!res.ok) {
        showStatus(lookupStatus, data.error || 'Lookup failed.', 'error');
        previewWrap.classList.remove('show');
        return;
      }

      startAdd(data);
      previewWrap.classList.add('show');
      previewWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      showStatus(lookupStatus, 'Something went wrong.', 'error');
    } finally {
      lookupBtn.disabled = false;
      lookupBtn.textContent = 'Look Up';
    }
  });
  document.getElementById('lookupInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') lookupBtn.click();
  });

  function startAdd(data){
    mode = 'add';
    previewLabel.textContent = 'Preview — edit anything before approving';
    approveBtn.textContent = 'Approve & Add';
    discardBtn.textContent = 'Discard';

    document.getElementById('fieldTitle').value = data.title || '';
    document.getElementById('fieldPrice').value = data.price || '';
    document.getElementById('fieldEbayPrice').value = data.price || '';
    document.getElementById('fieldGrade').value = data.guesses?.grade || '';
    document.getElementById('fieldSet').value = data.guesses?.set || '';
    document.getElementById('fieldEbayId').value = data.ebayItemId || '';

    currentImages = data.images || [];
    selectedImage = currentImages[0] || '';
    document.getElementById('fieldImage').value = selectedImage;
    renderImagePicker();

    const aspectsTable = document.getElementById('aspectsTable');
    aspectsTable.innerHTML = (data.aspects || [])
      .map((a) => `<tr><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.value)}</td></tr>`)
      .join('');
    document.getElementById('aspectsWrap').style.display = '';

    updateTilePreview();
  }

  function startEdit(card){
    mode = 'edit';
    previewLabel.textContent = `Editing — ${card.title}`;
    approveBtn.textContent = 'Save Changes';
    discardBtn.textContent = 'Cancel';

    document.getElementById('fieldTitle').value = card.title || '';
    document.getElementById('fieldPrice').value = card.price || '';
    document.getElementById('fieldEbayPrice').value = card.ebayPrice || '';
    document.getElementById('fieldGrade').value = card.grade || '';
    document.getElementById('fieldSet').value = card.set || '';
    document.getElementById('fieldEbayId').value = card.ebayItemId || '';

    currentImages = card.image ? [card.image] : [];
    selectedImage = card.image || '';
    document.getElementById('fieldImage').value = selectedImage;
    renderImagePicker();

    document.getElementById('aspectsTable').innerHTML = '';
    document.getElementById('aspectsWrap').style.display = 'none';

    updateTilePreview();
    previewWrap.classList.add('show');
    previewWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderImagePicker(){
    const picker = document.getElementById('imagePicker');
    picker.innerHTML = currentImages
      .map((url) => `<img src="${url}" class="${url === selectedImage ? 'selected' : ''}" data-url="${url}">`)
      .join('');
    picker.querySelectorAll('img').forEach((img) => {
      img.addEventListener('click', () => {
        selectedImage = img.dataset.url;
        document.getElementById('fieldImage').value = selectedImage;
        renderImagePicker();
        updateTilePreview();
      });
    });
  }

  document.getElementById('fieldImage').addEventListener('input', (e) => {
    selectedImage = e.target.value.trim();
    renderImagePicker();
    updateTilePreview();
  });

  function monogram(title){
    const words = (title || '').replace(/[—–-]/g, ' ').split(/\s+/).filter(Boolean);
    return (words.slice(0, 2).map((w) => w[0]).join('') || '?').toUpperCase();
  }

  function updateTilePreview(){
    const title = document.getElementById('fieldTitle').value || '—';
    const price = document.getElementById('fieldPrice').value || '—';
    const ebayPrice = document.getElementById('fieldEbayPrice').value.trim();
    const grade = document.getElementById('fieldGrade').value || '—';
    const set = document.getElementById('fieldSet').value || '—';
    const ebayId = document.getElementById('fieldEbayId').value.trim();

    document.getElementById('previewTitle').textContent = title;
    document.getElementById('previewTag').textContent = price;
    document.getElementById('previewGradeChip').textContent = grade;
    document.getElementById('previewMeta').textContent = set;

    const wasTag = document.getElementById('previewWasTag');
    if (ebayPrice) {
      wasTag.textContent = ebayPrice;
      wasTag.style.display = 'block';
    } else {
      wasTag.style.display = 'none';
    }

    const ebayLink = document.getElementById('previewEbayLink');
    ebayLink.href = ebayId ? `https://www.ebay.com/itm/${ebayId}` : '#';

    const img = document.getElementById('previewImg');
    const mark = document.getElementById('previewMark');
    if (selectedImage) {
      img.src = selectedImage;
      img.style.display = 'block';
      mark.style.display = 'none';
    } else {
      img.style.display = 'none';
      mark.style.display = 'block';
      mark.textContent = monogram(title);
    }
  }

  ['fieldTitle', 'fieldPrice', 'fieldEbayPrice', 'fieldGrade', 'fieldSet'].forEach((id) => {
    document.getElementById(id).addEventListener('input', updateTilePreview);
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Approve / Save / Discard ----
  approveBtn.addEventListener('click', async () => {
    hideStatus(approveStatus);
    approveBtn.disabled = true;
    approveBtn.textContent = mode === 'edit' ? 'Saving…' : 'Adding…';

    const card = {
      title: document.getElementById('fieldTitle').value.trim(),
      price: document.getElementById('fieldPrice').value.trim(),
      ebayPrice: document.getElementById('fieldEbayPrice').value.trim(),
      grade: document.getElementById('fieldGrade').value.trim(),
      set: document.getElementById('fieldSet').value.trim(),
      image: selectedImage,
      ebayItemId: document.getElementById('fieldEbayId').value.trim(),
    };

    const endpoint = mode === 'edit' ? '/api/cards-update' : '/api/cards-add';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(card),
      });
      const data = await res.json();

      if (!res.ok) {
        showStatus(approveStatus, data.error || 'Failed to save card.', 'error');
        return;
      }

      if (mode === 'edit') {
        const i = existingCards.findIndex((c) => c.ebayItemId === card.ebayItemId);
        if (i !== -1) existingCards[i] = card;
      } else {
        existingCards.push(card);
      }
      renderCardList();

      showStatus(approveStatus, mode === 'edit' ? 'Saved — live on the site in a minute or so.' : 'Added — live on the site in a minute or so.', 'success');
      setTimeout(resetTool, 1800);
    } catch (err) {
      showStatus(approveStatus, 'Something went wrong.', 'error');
    } finally {
      approveBtn.disabled = false;
      approveBtn.textContent = mode === 'edit' ? 'Save Changes' : 'Approve & Add';
    }
  });

  discardBtn.addEventListener('click', resetTool);

  function resetTool(){
    document.getElementById('lookupInput').value = '';
    previewWrap.classList.remove('show');
    hideStatus(lookupStatus);
    hideStatus(approveStatus);
    currentImages = [];
    selectedImage = '';
    mode = 'add';
  }

  // ---- Existing cards list ----
  const cardList = document.getElementById('cardList');
  const listStatus = document.getElementById('listStatus');
  let existingCards = [];

  async function loadCardList(){
    try {
      const res = await fetch('/cards.json', { cache: 'no-store' });
      existingCards = await res.json();
      renderCardList();
    } catch (err) {
      cardList.innerHTML = '<div class="empty-list">Couldn’t load your cards right now.</div>';
    }
  }

  function renderCardList(){
    if (!existingCards.length) {
      cardList.innerHTML = '<div class="empty-list">No cards yet.</div>';
      return;
    }
    cardList.innerHTML = existingCards
      .map((card) => `
        <div class="card-row" data-id="${escapeHtml(card.ebayItemId)}">
          <div class="thumb">
            ${card.image
              ? `<img src="${card.image}" alt="">`
              : `<span class="mark">${monogram(card.title)}</span>`}
          </div>
          <div class="row-info">
            <div class="row-title">${escapeHtml(card.title)}</div>
            <div class="row-meta">${escapeHtml(card.price)}${card.ebayPrice ? ` (was ${escapeHtml(card.ebayPrice)})` : ''}${card.grade ? ' · ' + escapeHtml(card.grade) : ''}</div>
          </div>
          <div class="row-actions">
            <button class="btn-small" data-action="edit">Edit</button>
            <button class="btn-danger" data-action="delete">Delete</button>
          </div>
        </div>
      `)
      .join('');

    cardList.querySelectorAll('.card-row').forEach((row) => {
      const id = row.dataset.id;
      row.querySelector('[data-action="edit"]').addEventListener('click', () => {
        const card = existingCards.find((c) => c.ebayItemId === id);
        if (card) startEdit(card);
      });
      row.querySelector('[data-action="delete"]').addEventListener('click', () => {
        const card = existingCards.find((c) => c.ebayItemId === id);
        if (card) deleteCard(card);
      });
    });
  }

  async function deleteCard(card){
    if (!confirm(`Delete "${card.title}"? This can't be undone.`)) return;

    hideStatus(listStatus);
    try {
      const res = await fetch('/api/cards-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ebayItemId: card.ebayItemId }),
      });
      const data = await res.json();

      if (!res.ok) {
        showStatus(listStatus, data.error || 'Failed to delete card.', 'error');
        return;
      }

      existingCards = existingCards.filter((c) => c.ebayItemId !== card.ebayItemId);
      renderCardList();
      showStatus(listStatus, 'Deleted — live on the site in a minute or so.', 'success');
      setTimeout(() => hideStatus(listStatus), 2500);

      // If the deleted card was open in the editor, close it out.
      if (mode === 'edit' && document.getElementById('fieldEbayId').value === card.ebayItemId) {
        resetTool();
      }
    } catch (err) {
      showStatus(listStatus, 'Something went wrong.', 'error');
    }
  }
</script>

</body>
</html>
